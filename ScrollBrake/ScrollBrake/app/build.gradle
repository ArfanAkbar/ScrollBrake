plugins {
    id 'com.android.application'
}

android {
    namespace 'com.scrollbrake.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.scrollbrake.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // A fixed key, so every new build installs over the old one on your phone.
    // (Fine for testing and sharing with friends. Use a private key before Google Play.)
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
