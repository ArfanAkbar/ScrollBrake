# Builds ScrollBrake in the cloud every time you upload changes.
# The finished app appears under "Releases" on your GitHub page as ScrollBrake.apk.
name: Build ScrollBrake app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Check the project files are all there
        run: |
          missing=0
          for f in settings.gradle build.gradle gradle.properties app/build.gradle \
                   app/src/main/AndroidManifest.xml \
                   app/src/main/java/com/scrollbrake/app/MainActivity.java \
                   app/src/main/java/com/scrollbrake/app/ScrollBrakeService.java \
                   app/src/main/java/com/scrollbrake/app/Prefs.java; do
            if [ ! -f "$f" ]; then echo "MISSING FILE: $f"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "Some files were not uploaded. Upload them and the build will run again."
            exit 1
          fi
          echo "All project files found."

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ScrollBrake.apk

      - name: Save the app as a build file
        uses: actions/upload-artifact@v4
        with:
          name: ScrollBrake-apk
          path: ScrollBrake.apk

      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScrollBrake.apk \
            --target "${{ github.sha }}" \
            --title "ScrollBrake (latest build)" \
            --notes "Open this page on your Android phone, tap ScrollBrake.apk to download, then open it to install."
