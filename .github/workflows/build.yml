# Builds ScrollBrake in the cloud every time you upload changes.
# The finished app appears under "Releases" on your GitHub page as ScrollBrake.apk.
name: Build ScrollBrake app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ScrollBrake.apk

      - name: Save the app as a build file
        uses: actions/upload-artifact@v4
        with:
          name: ScrollBrake-apk
          path: ScrollBrake.apk

      - name: Publish the download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ScrollBrake.apk \
            --target "${{ github.sha }}" \
            --title "ScrollBrake (latest build)" \
            --notes "Open this page on your Android phone, tap ScrollBrake.apk to download, then open it to install."
